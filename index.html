<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sith Vanguard Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <nav class="nav">
      <div class="logo">The Sith Vanguard</div>
      <div class="links">
        <a href="#overview">Overview</a>
        <a href="#directory">Directory</a>
        <a href="#ranks">Ranks</a>
        <a href="#resources">Resources</a>
      </div>
    </nav>

    <div class="hero-content">
      <p class="eyebrow">The Sith Order</p>
      <h1 id="portal-title">The Sith Vanguard Portal</h1>
      <p id="portal-tagline">Warriors of the Order</p>
      <a class="button" href="#overview">Enter Portal</a>
    </div>
  </header>

  <main>
    <section id="overview" class="section">
      <h2>Overview</h2>
      <div class="panel">
        <p id="overview-description"></p>
        <div class="info-grid">
          <div>
            <h3>Entry</h3>
            <p id="overview-entry"></p>
          </div>
          <div>
            <h3>Expectations</h3>
            <p id="overview-expectations"></p>
          </div>
          <div>
            <h3>Focus</h3>
            <p id="overview-focus"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="directory" class="section">
      <h2>Directory</h2>
      <div id="directory-list" class="cards"></div>
    </section>

    <section id="ranks" class="section">
      <h2>Ranks</h2>
      <div id="rank-list" class="rank-list"></div>
    </section>

    <section id="resources" class="section">
      <h2>Resources</h2>
      <div id="resource-list" class="resources"></div>
    </section>
  </main>

  <footer>
    <p>The Sith Vanguard Portal • The Sith Order</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
